name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Two tags pushed close together would otherwise race to publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # A cold Rust build is most of this job's runtime; the cache keys on
      # Cargo.lock so it only rebuilds when dependencies actually change.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run backend tests
        run: python -m unittest discover -s app/tests -t app/tests

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Check Tauri command wiring
        working-directory: frontend
        run: npm run check:commands

      - name: Stamp release version
        shell: pwsh
        working-directory: frontend
        run: |
          $ref = "${{ github.ref_name }}"
          if ($ref -match '^v\d+\.\d+\.\d+$') {
            node ./scripts/set-version.mjs $ref
          } else {
            Write-Host "Ref '$ref' is not a release tag; keeping the committed version."
          }

      # beforeBuildCommand runs build:self-contained, so this also rebuilds the
      # Python backend -- a release can never package a stale one.
      - name: Build Tauri release bundle
        working-directory: frontend
        run: npm run tauri -- build

      - name: Generate checksums
        shell: pwsh
        run: |
          $bundleRoot = "frontend/src-tauri/target/release/bundle"
          $checksumFile = Join-Path $bundleRoot "SHA256SUMS.txt"
          if (Test-Path $checksumFile) { Remove-Item $checksumFile -Force }
          Get-ChildItem -Path $bundleRoot -Recurse -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | ForEach-Object {
            $hash = Get-FileHash -Algorithm SHA256 -Path $_.FullName
            $relative = $_.FullName.Substring((Resolve-Path $bundleRoot).Path.Length + 1).Replace("\", "/")
            "$($hash.Hash)  $relative" | Out-File -FilePath $checksumFile -Append -Encoding utf8
          }
          Get-Content $checksumFile

      # A manual workflow_dispatch run is for checking the build, not for
      # publishing -- without this guard it would cut a release named after
      # whatever branch it ran on.
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # Published as a draft so the notes can be checked before it is
          # visible. Remove this line once you are happy going straight out.
          draft: true
          generate_release_notes: true
          body: |
            ## Install

            Download `Auto-Ripper_*_x64-setup.exe` (recommended) or the `.msi` below and run it.

            **Windows will warn you.** These installers are not code-signed, so
            SmartScreen shows "Windows protected your PC" — click **More info →
            Run anyway**. Verify your download against `SHA256SUMS.txt` if you
            want to be sure of it.

            ## Before you can rip

            Auto-Ripper drives external tools rather than bundling them. You need:

            - [MakeMKV](https://www.makemkv.com/) — reads and decrypts discs
            - [ffmpeg / ffprobe](https://ffmpeg.org/download.html) — probing and splitting
            - A free [TMDB API key](https://www.themoviedb.org/settings/api) — identifies discs

            The app detects the tool paths on first run and tells you what is missing.

            ---
          files: |
            frontend/src-tauri/target/release/bundle/**/*

      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: autorippr-installers
          path: frontend/src-tauri/target/release/bundle/**/*
