name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is slow or awkward today?
      description: >
        Describe the situation rather than the solution — the underlying
        problem often has a better fix than the one that first comes to mind.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would you like instead?
    validations:
      required: false
